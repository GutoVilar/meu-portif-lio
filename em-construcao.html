<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico?v=5" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=5">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=5">
    <title>Em construção | Gustavo Vilar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Usa o mesmo tema (claro/escuro) escolhido no portfólio -->
    <script>if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light");</script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #05080f;
            --bg-glow: rgba(100, 255, 218, 0.10);
            --bg-glow-2: rgba(55, 80, 230, 0.16);
            --accent: #64ffda;
            --blue: hsl(234, 90%, 65%);
            --text: #ffffff;
            --muted: #8892b0;
            --card: #0d1117;
            --line: rgba(100, 255, 218, 0.28);
            --btn-text: #04101a;
            --btn-glow: rgba(100, 255, 218, 0.45);
            --btn2-bg: #0d1117;
            --btn2-border: rgba(255, 255, 255, 0.12);
        }
        html.light {
            --bg: #f4f7fb;
            --bg-glow: rgba(29, 78, 216, 0.10);
            --bg-glow-2: rgba(2, 132, 199, 0.12);
            --accent: #0d9488;
            --blue: #1d4ed8;
            --text: #0f172a;
            --muted: #475569;
            --card: #ffffff;
            --line: rgba(29, 78, 216, 0.3);
            --btn-text: #ffffff;
            --btn-glow: rgba(29, 78, 216, 0.4);
            --btn2-bg: #ffffff;
            --btn2-border: rgba(15, 23, 42, 0.15);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Inter", sans-serif;
            color: var(--text);
            background:
                radial-gradient(700px circle at 15% 10%, var(--bg-glow-2), transparent 60%),
                radial-gradient(700px circle at 90% 90%, var(--bg-glow), transparent 60%),
                var(--bg);
        }

        .box { max-width: 520px; text-align: center; animation: subir 0.7s ease both; }

        .icone {
            width: 58px; height: 58px; margin: 0 auto 22px;
            display: grid; place-items: center; border-radius: 16px;
            font-size: 22px; color: var(--accent);
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid var(--line);
            animation: flutuar 3.5s ease-in-out infinite;
        }
        html.light .icone { background: rgba(29, 78, 216, 0.08); color: var(--blue); }

        .badge {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
            color: var(--accent); padding: 6px 14px; border-radius: 20px;
            border: 1px solid var(--line); background: rgba(100, 255, 218, 0.07);
            margin-bottom: 18px;
        }
        html.light .badge { color: var(--blue); background: rgba(29, 78, 216, 0.07); }
        .badge i {
            width: 8px; height: 8px; border-radius: 50%; background: currentColor;
            box-shadow: 0 0 0 0 currentColor; animation: pulso 1.8s infinite;
        }

        h1 { font-size: clamp(36px, 7vw, 52px); font-weight: 800; letter-spacing: -1px; margin-bottom: 16px; }
        h1 span {
            background: linear-gradient(90deg, var(--accent), var(--blue));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }

        p { color: var(--muted); font-size: 16px; line-height: 1.7; margin-bottom: 30px; }

        .botoes { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 700;
            text-decoration: none; transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .btn:hover { transform: translateY(-3px) scale(1.04); }
        .btn-primario {
            color: var(--btn-text);
            background: linear-gradient(90deg, var(--accent), var(--blue));
            box-shadow: 0 0 22px var(--btn-glow);
        }
        .btn-primario:hover { box-shadow: 0 0 34px var(--btn-glow), 0 0 60px var(--btn-glow); }
        .btn-secundario { color: var(--text); background: var(--btn2-bg); border: 1px solid var(--btn2-border); }
        .btn-secundario:hover { border-color: var(--accent); box-shadow: 0 0 20px var(--btn-glow); }

        @keyframes subir { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
        @keyframes flutuar { 50% { transform: translateY(-6px); } }
        @keyframes pulso { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <main class="box">
        <div class="icone"><i class="fa-solid fa-code"></i></div>
        <span class="badge"><i></i> Em desenvolvimento</span>
        <h1>Em <span>construção</span></h1>
        <p>As informações deste projeto ainda estão sendo preparadas. Enquanto isso, você pode conhecer meus outros projetos ou acompanhar o desenvolvimento no GitHub.</p>
        <div class="botoes">
            <a href="index.html#projetos" class="btn btn-primario"><i class="fa-solid fa-arrow-left"></i> Voltar aos projetos</a>
            <a href="https://github.com/GutoVilar" target="_blank" rel="noopener" class="btn btn-secundario"><i class="fa-brands fa-github"></i> GitHub</a>
        </div>
    </main>
</body>
</html>
